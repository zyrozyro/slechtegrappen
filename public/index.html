<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>lach dan</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500&display=swap');

  :root {
    --ink: #1b1b1f;
    --paper: #fbf7ee;
    --card: #ffffff;
    --punch: #ff5a36;
    --punch-dark: #d6461f;
    --line: #e8e1d2;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--paper);
    font-family: 'Inter', system-ui, sans-serif;
    color: var(--ink);
    padding: 24px;
  }

  main {
    width: 100%;
    max-width: 520px;
    text-align: center;
  }

  h1 {
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 700;
    font-size: clamp(1.8rem, 5vw, 2.4rem);
    letter-spacing: -0.02em;
    margin: 0 0 8px;
  }

  p.sub {
    margin: 0 0 32px;
    color: #6b6a63;
    font-size: 0.95rem;
  }

  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 18px;
    padding: 40px 28px;
    min-height: 140px;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 1px 0 var(--line);
  }

  #joke-text {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 1.15rem;
    line-height: 1.5;
    margin: 0;
  }

  #joke-text.placeholder {
    color: #a8a69c;
    font-family: 'Inter', sans-serif;
    font-size: 1rem;
  }

  .spinner {
    width: 28px;
    height: 28px;
    border: 3px solid var(--line);
    border-top-color: var(--punch);
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
  }

  @keyframes spin { to { transform: rotate(360deg); } }

  @media (prefers-reduced-motion: reduce) {
    .spinner { animation-duration: 1.6s; }
  }

  button {
    margin-top: 28px;
    background: var(--punch);
    color: #fff;
    border: none;
    padding: 14px 28px;
    font-size: 1rem;
    font-weight: 500;
    font-family: 'Inter', sans-serif;
    border-radius: 999px;
    cursor: pointer;
    transition: background 0.15s ease, transform 0.1s ease;
  }

  button:hover:not(:disabled) { background: var(--punch-dark); }
  button:active:not(:disabled) { transform: scale(0.97); }

  button:disabled {
    opacity: 0.6;
    cursor: default;
  }

  #error-text {
    color: var(--punch-dark);
    font-size: 0.9rem;
    margin-top: 14px;
    min-height: 1.2em;
  }
</style>
</head>
<body>
  <main>
    <h1>Need a laugh?</h1>
    <p class="sub">Tap the button, get a random joke from the database.</p>

    <div class="card">
      <p id="joke-text" class="placeholder">Your joke will show up here.</p>
    </div>

    <button id="joke-btn">Tell me a joke</button>
    <p id="error-text"></p>
  </main>

  <script>
    const btn = document.getElementById('joke-btn');
    const jokeText = document.getElementById('joke-text');
    const errorText = document.getElementById('error-text');

    async function getJoke() {
      btn.disabled = true;
      errorText.textContent = '';
      jokeText.classList.remove('placeholder');
      jokeText.innerHTML = '<div class="spinner"></div>';

      try {
        const res = await fetch('/api/joke');
        const data = await res.json();

        if (!res.ok) {
          errorText.textContent = data.error || 'Something went wrong.';
          jokeText.textContent = '—';
        } else {
          jokeText.textContent = data.joke;
        }
      } catch (err) {
        errorText.textContent = 'Could not reach the server. Check your connection.';
        jokeText.textContent = '—';
      } finally {
        btn.disabled = false;
      }
    }

    btn.addEventListener('click', getJoke);
  </script>
</body>
</html>
