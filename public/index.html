<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>lach dan</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <span id="joke-text">-</span>
  <button id="joke-btn">Tell me a joke</button>

  <script>
    const btn = document.getElementById("joke-btn");
    const jokeText = document.getElementById("joke-text");
    const jokeCard = document.getElementById("joke-card");

    function wait(ms) {
      return new Promise(resolve => setTimeout(resolve, ms));
    }

    async function getJoke() {
      btn.disabled = true;

      // loading screen to build anticipation
      jokeText.classList.add("loading");
      jokeText.innerHTML = '<div class="spinner"></div><span>Thinking...</span>';

      try {
        const res = await fetch("/api/joke");
        const data = await res.json();

        if (!res.ok) {
          jokeText.innerHTML = data.error || "Something went wrong.";
        } else {
          await wait(1000 + 1000 * Math.random());
          jokeText.innerHTML = '<div class="spinner"></div><span>Fetching resources...</span>';
          await wait(2000 + 1000 * Math.random());
          jokeText.innerHTML = '<div class="spinner"></div><span>Awaiting response...</span>';
          await wait(1000 + 1000 * Math.random());
          jokeText.innerHTML = '<div class="spinner"></div><span>Parsing data...</span>';
          await wait(1500 + 500 * Math.random());

          jokeText.classList.remove("loading");
          jokeText.innerHTML = data.joke;
        }
      } catch (err) {
        jokeText.classList.remove("loading");
        jokeText.innerHTML = err.message || "Could not reach the server. Check your connection.";
      } finally {
        btn.disabled = false;
      }
    }

    btn.addEventListener("click", getJoke);
  </script>
</body>
</html>
